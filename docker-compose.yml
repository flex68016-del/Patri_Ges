version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: patrimoine-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - patrimoine-network

  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: patrimoine-auth-service
    environment:
      APP_ENV: local
      APP_DEBUG: true
      APP_URL: http://localhost:8001
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: auth_db
      DB_USERNAME: auth_user
      DB_PASSWORD: auth_password
      AUTH_SERVICE_URL: http://auth-service:9000
    volumes:
      - ./services/auth-service/storage/app/jwt:/app/storage/app/jwt
    ports:
      - "8001:9000"
    depends_on:
      - postgres
    networks:
      - patrimoine-network

  patrimoine-service:
    build:
      context: ./services/patrimoine-service
      dockerfile: Dockerfile
    container_name: patrimoine-patrimoine-service
    environment:
      APP_ENV: local
      APP_DEBUG: true
      APP_URL: http://localhost:8002
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: patrimoine_db
      DB_USERNAME: patrimoine_user
      DB_PASSWORD: patrimoine_password
      AUTH_SERVICE_URL: http://auth-service:9000
    volumes:
      - ./services/patrimoine-service/storage/app/jwt:/app/storage/app/jwt
    ports:
      - "8002:9000"
    depends_on:
      - postgres
      - auth-service
    networks:
      - patrimoine-network

  operations-service:
    build:
      context: ./services/operations-service
      dockerfile: Dockerfile
    container_name: patrimoine-operations-service
    environment:
      APP_ENV: local
      APP_DEBUG: true
      APP_URL: http://localhost:8003
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: operations_db
      DB_USERNAME: operations_user
      DB_PASSWORD: operations_password
      AUTH_SERVICE_URL: http://auth-service:9000
      PATRIMOINE_SERVICE_URL: http://patrimoine-service:9000
    volumes:
      - ./services/operations-service/storage/app/jwt:/app/storage/app/jwt
    ports:
      - "8003:9000"
    depends_on:
      - postgres
      - auth-service
      - patrimoine-service
    networks:
      - patrimoine-network

  web:
    build:
      context: ./services/web
      dockerfile: Dockerfile
    container_name: patrimoine-web
    environment:
      APP_ENV: local
      APP_DEBUG: true
      APP_URL: http://localhost:8000
      AUTH_SERVICE_URL: http://auth-service:9000
      PATRIMOINE_SERVICE_URL: http://patrimoine-service:9000
      OPERATIONS_SERVICE_URL: http://operations-service:9000
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: web_db
      DB_USERNAME: web_user
      DB_PASSWORD: web_password
    volumes:
      - ./services/web/storage/app/jwt:/app/storage/app/jwt
    ports:
      - "8000:9000"
    depends_on:
      - auth-service
      - patrimoine-service
      - operations-service
    networks:
      - patrimoine-network

  gateway:
    image: nginx:alpine
    container_name: patrimoine-gateway
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - web
      - auth-service
      - patrimoine-service
      - operations-service
    networks:
      - patrimoine-network

volumes:
  pgdata:

networks:
  patrimoine-network:
    driver: bridge
